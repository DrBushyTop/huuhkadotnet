name: Analytics image

on:
  workflow_dispatch:
  push:
    branches: [metrics-archive]
    paths:
      - analytics/**
      - .github/workflows/analytics-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: analytics
          push: true
          tags: ghcr.io/drbushytop/huuhkadotnet-analytics:${{ github.sha }}
