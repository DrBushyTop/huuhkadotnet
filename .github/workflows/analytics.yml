name: Analytics

on:
  pull_request:
    paths:
      - analytics/**
      - .github/workflows/analytics.yml
  push:
    branches: [master]
    paths:
      - analytics/**
      - .github/workflows/analytics.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: What to deploy
        type: choice
        options: [changed, viewer, job, both]
        default: changed

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: huuhkadotnet-prod
  SITE_NAME: huuhkadotnet-metrics
  JOB_NAME: huuhkadotnet-metrics-export
  REGISTRY: huuhka
  IMAGE: huuhkadotnet-analytics

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      viewer: ${{ steps.changes.outputs.viewer }}
      job: ${{ steps.changes.outputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            analytics/package-lock.json
            analytics/viewer/package-lock.json
      - name: Test job
        working-directory: analytics
        run: |
          npm ci
          npm test
      - name: Test and build viewer
        working-directory: analytics/viewer
        run: |
          npm ci
          npm test
          npm run build
      - name: Compile infrastructure
        run: az bicep build --file analytics/deployment/main.bicep --stdout > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: analytics/viewer/dist
          retention-days: 7
      - name: Detect changes
        id: changes
        env:
          CHOICE: ${{ inputs.deploy || 'changed' }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$CHOICE" != changed ]; then
            [ "$CHOICE" = viewer ] || [ "$CHOICE" = both ] && echo viewer=true >> "$GITHUB_OUTPUT"
            [ "$CHOICE" = job ] || [ "$CHOICE" = both ] && echo job=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          files=$(git diff --name-only "$BEFORE" HEAD)
          echo "$files" | grep -qE '^(analytics/viewer/|\.github/workflows/analytics\.yml)' && echo viewer=true >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^analytics/(src/|package(-lock)?\.json|Dockerfile|\.dockerignore)|^\.github/workflows/analytics\.yml' && echo job=true >> "$GITHUB_OUTPUT"
          true

  deploy-viewer:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viewer
          path: dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list -n "$SITE_NAME" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

  deploy-job:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.outputs.job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n "$REGISTRY"
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: analytics
          push: true
          tags: ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
      - name: Point the job at the new digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          az containerapp job update -g "$RESOURCE_GROUP" -n "$JOB_NAME" \
            --image "$REGISTRY.azurecr.io/$IMAGE@$DIGEST" -o none
          echo "Job image: $REGISTRY.azurecr.io/$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
